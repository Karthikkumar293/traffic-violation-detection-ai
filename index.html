<script>
const $ = id => document.getElementById(id);

let selectedFile = null;

const drop = $('drop');
const file = $('file');
const preview = $('preview');

/* =========================
   CLOCK
========================= */
function clock() {
    const d = new Date();

    $('clock').textContent =
        d.toLocaleString('en-IN', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        }).toUpperCase();
}

clock();
setInterval(clock, 1000);


/* =========================
   TOAST
========================= */
function toast(msg) {
    const t = $('toast');

    t.textContent = msg;
    t.classList.add('show');

    clearTimeout(window.tt);

    window.tt = setTimeout(() => {
        t.classList.remove('show');
    }, 3500);
}


/* =========================
   NAVIGATION
========================= */
function nav(btn, target) {

    document
        .querySelectorAll('.nav button')
        .forEach(x => x.classList.remove('active'));

    btn.classList.add('active');

    if (target === 'detection') {

        document
            .querySelector('#detection')
            .scrollIntoView({ behavior: 'smooth' });

    } else if (target === 'overview') {

        document
            .querySelector('#overview')
            .scrollIntoView({ behavior: 'smooth' });

    } else {

        toast(target.toUpperCase() + ' MODULE • Ready for integration');
    }
}


/* =========================
   FILE SELECTION
========================= */

$('choose').onclick = function () {
    file.click();
};


drop.onclick = function (e) {

    if (e.target.closest('.loading')) {
        return;
    }

    file.click();
};


/* =========================
   DRAG & DROP
========================= */

['dragenter', 'dragover'].forEach(eventName => {

    drop.addEventListener(eventName, e => {

        e.preventDefault();

        drop.classList.add('drag');

    });

});


['dragleave', 'drop'].forEach(eventName => {

    drop.addEventListener(eventName, e => {

        e.preventDefault();

        drop.classList.remove('drag');

    });

});


drop.addEventListener('drop', e => {

    const droppedFile = e.dataTransfer.files[0];

    if (droppedFile) {

        setFile(droppedFile);

    }

});


file.addEventListener('change', () => {

    if (file.files[0]) {

        setFile(file.files[0]);

    }

});


/* =========================
   SET FILE
========================= */

function setFile(f) {

    if (!f.type.startsWith('image/')) {

        toast('Please select an image file.');

        return;
    }


    if (f.size > 12 * 1024 * 1024) {

        toast('Image is larger than the 12 MB limit.');

        return;
    }


    selectedFile = f;

    preview.src = URL.createObjectURL(f);

    drop.classList.add('has-image');

    $('analyse').disabled = false;

    $('fileMeta').textContent =
        `${f.name} • ${(f.size / 1024 / 1024).toFixed(2)} MB • READY FOR ANALYSIS`;

    toast('Traffic image loaded successfully.');
}


/* =========================
   CLEAR
========================= */

$('clear').onclick = function () {

    selectedFile = null;

    file.value = '';

    preview.removeAttribute('src');

    drop.classList.remove('has-image');

    $('analyse').disabled = true;

    $('fileMeta').textContent = '';

    $('resultImageWrap').classList.remove('show');

    resetResults();

    toast('Analysis workspace cleared.');
};


/* =========================
   RESET RESULTS
========================= */

function resetResults() {

    $('violations').textContent = '00';

    $('helmet').textContent = '—';

    $('plate').textContent = '—';

    $('confidence').textContent = '—';

    $('status').textContent = 'Waiting for image';

    $('decisionTag').textContent = 'WAITING';

    $('badge').textContent = 'READY';

    $('badge').className = 'decision-badge';

    $('confText').textContent = '0%';

    $('bar').style.width = '0%';

    $('detailViolations').textContent = '—';

    $('detailPlate').textContent = 'Not detected';

    $('ocrConf').textContent = '—';

    $('plateConf').textContent = '—';

    $('violationCount').textContent = '0 cases';

    $('list').innerHTML =
        '<div class="empty-result">Upload an image to begin AI analysis.</div>';
}


/* =========================
   PERCENTAGE
========================= */

function pct(v) {

    let n = Number(v || 0);

    if (n <= 1) {
        n *= 100;
    }

    return Math.max(
        0,
        Math.min(100, n)
    );
}


/* =========================
   FORMAT NAME
========================= */

function formatName(s) {

    return String(s || 'Unknown')
        .replaceAll('_', ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
}


/* =========================================================
   IMPORTANT
   ANALYSE TRAFFIC BUTTON
========================================================= */

$('analyse').onclick = async function () {

    console.log('====================================');
    console.log('🚀 TRAFFIC ANALYSIS STARTED');
    console.log('====================================');


    /* Check image */

    if (!selectedFile) {

        toast('Choose a traffic image first.');

        return;
    }


    console.log('📷 File:', selectedFile.name);

    console.log(
        '📦 Size:',
        selectedFile.size,
        'bytes'
    );

    console.log(
        '🖼️ Type:',
        selectedFile.type
    );


    /* Create FormData */

    const formData = new FormData();

    formData.append(
        'image',
        selectedFile,
        selectedFile.name
    );


    /* Show loading */

    $('loading').classList.add('show');

    $('analyse').disabled = true;

    $('choose').disabled = true;


    try {

        console.log(
            '📡 Sending POST request to /api/analyze...'
        );


        const response = await fetch(
            '/api/analyze',
            {
                method: 'POST',
                body: formData
            }
        );


        console.log(
            '📡 HTTP status:',
            response.status
        );


        console.log(
            '📡 Response OK:',
            response.ok
        );


        /* Read response as TEXT first */

        const responseText =
            await response.text();


        console.log(
            '📄 Server response:',
            responseText
        );


        let data;


        /* Convert response to JSON */

        try {

            data =
                JSON.parse(responseText);

        } catch (jsonError) {

            console.error(
                '❌ JSON parsing failed:',
                jsonError
            );

            throw new Error(
                'Server returned an invalid response: ' +
                responseText.substring(0, 300)
            );
        }


        /* Server returned error */

        if (!response.ok) {

            console.error(
                '❌ Backend error:',
                data
            );


            throw new Error(
                data.details ||
                data.error ||
                data.message ||
                'Analysis request failed.'
            );
        }


        /* Success */

        console.log(
            '===================================='
        );

        console.log(
            '✅ ANALYSIS SUCCESSFUL'
        );

        console.log(
            data
        );

        console.log(
            '===================================='
        );


        render(data);


        toast(
            'Traffic analysis completed successfully.'
        );

    }


    catch (error) {

        console.error(
            '===================================='
        );

        console.error(
            '❌ ANALYSIS FAILED'
        );

        console.error(
            error
        );

        console.error(
            '===================================='
        );


        $('status').textContent =
            'Analysis failed';


        $('decisionTag').textContent =
            'ERROR';


        $('badge').textContent =
            'ERROR';


        $('badge').className =
            'decision-badge danger';


        toast(
            error.message ||
            'Analysis failed. Check the backend.'
        );

    }


    finally {

        $('loading').classList.remove('show');

        $('analyse').disabled = false;

        $('choose').disabled = false;

    }

};


/* =========================
   RENDER RESULT
========================= */

function render(d) {

    console.log(
        'Rendering AI result:',
        d
    );


    const vs =
        Array.isArray(d.violations)
            ? d.violations
            : [];


    const confidence =
        pct(d.overall_confidence);


    const decision =
        d.decision || 'NOT_DETECTED';


    $('violations').textContent =
        String(vs.length).padStart(2, '0');


    $('helmet').textContent =
        d.helmet_status || 'Not detected';


    $('plate').textContent =
        d.plate_text || '—';


    $('confidence').textContent =
        confidence.toFixed(1) + '%';


    $('confText').textContent =
        confidence.toFixed(1) + '%';


    setTimeout(() => {

        $('bar').style.width =
            confidence + '%';

    }, 80);


    $('detailViolations').textContent =
        vs.length
            ? vs.map(v => formatName(v.type)).join(', ')
            : 'None';


    $('detailPlate').textContent =
        d.plate_text || 'Not detected';


    $('ocrConf').textContent =
        d.ocr_confidence != null
            ? pct(d.ocr_confidence).toFixed(1) + '%'
            : '—';


    $('plateConf').textContent =
        d.plate_confidence != null
            ? pct(d.plate_confidence).toFixed(1) + '%'
            : '—';


    $('violationCount').textContent =
        vs.length +
        ' case' +
        (vs.length === 1 ? '' : 's');


    const status =
        decision === 'HUMAN_REVIEW'
            ? 'Human review required'
            : decision === 'DETECTED'
                ? 'Violation detected'
                : 'No target violation detected';


    $('status').textContent =
        status;


    $('decisionTag').textContent =
        decision.replaceAll('_', ' ');


    $('badge').textContent =
        decision === 'HUMAN_REVIEW'
            ? 'REVIEW'
            : decision === 'DETECTED'
                ? 'ALERT'
                : 'CLEAR';


    $('badge').className =
        'decision-badge ' +
        (
            decision === 'HUMAN_REVIEW'
                ? 'review'
                : decision === 'DETECTED'
                    ? 'danger'
                    : ''
        );


    $('list').innerHTML =
        vs.length

            ? vs.map(v =>

                `<div class="vitem">
                    <span>⚠ ${formatName(v.type)}</span>
                    <b>${pct(v.confidence).toFixed(1)}%</b>
                </div>`

            ).join('')

            : '<div class="empty-result">✓ No target violations detected.</div>';


    /* Annotated image */

    if (d.annotated_image) {

        $('resultImage').src =
            'data:image/jpeg;base64,' +
            d.annotated_image;

        $('resultImageWrap')
            .classList
            .add('show');

    }


    /* Scroll result */

    document
        .querySelector('#overview')
        .scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });

}


/* =========================
   BACKEND HEALTH CHECK
========================= */

fetch('/api/health')

    .then(response => {

        if (!response.ok) {

            throw new Error(
                'Backend health check failed'
            );
        }

        return response.json();

    })

    .then(health => {

        console.log(
            '✅ Backend health:',
            health
        );


        if (
            health.plate_model === false ||
            health.ocr === false
        ) {

            $('plateReady').textContent =
                '● OPTIONAL';

        }

    })

    .catch(error => {

        console.error(
            '❌ Backend offline:',
            error
        );


        $('systemText').textContent =
            'BACKEND OFFLINE';


        $('systemText')
            .previousElementSibling
            .style.background =
            'var(--red)';

    });

</script>
